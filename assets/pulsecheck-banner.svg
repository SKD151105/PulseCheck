<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PulseCheck Banner</title>
  <desc id="desc">PulseCheck realtime uptime monitoring banner with waveform and telemetry styling.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#03050F"/>
      <stop offset="0.45" stop-color="#091022"/>
      <stop offset="0.75" stop-color="#09233F"/>
      <stop offset="1" stop-color="#05322D"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1160 210) rotate(128) scale(350 520)">
      <stop stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGreen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1380 340) rotate(150) scale(310 440)">
      <stop stop-color="#10B981" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line" x1="140" y1="0" x2="1460" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="lineSoft" x1="140" y1="0" x2="1460" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.32"/>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#D1D5DB" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="24" fill="#020617" opacity="0.16"/>
  <rect width="1600" height="520" rx="24" fill="url(#grid)"/>

  <circle cx="1160" cy="210" r="360" fill="url(#glowBlue)"/>
  <circle cx="1380" cy="340" r="330" fill="url(#glowGreen)"/>

  <g opacity="0.88">
    <path d="M140 364H360L420 286L472 424L540 256L602 364H690L736 320L790 396L864 228L942 364H1030L1080 308L1146 388L1218 236L1290 364H1460" stroke="url(#lineSoft)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#softBlur)"/>
    <path d="M140 364H360L420 286L472 424L540 256L602 364H690L736 320L790 396L864 228L942 364H1030L1080 308L1146 388L1218 236L1290 364H1460" stroke="url(#line)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#E5E7EB" opacity="0.78" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="17" letter-spacing="1.4">
    <text x="120" y="92">MERN</text>
    <text x="215" y="92">NODE + EXPRESS</text>
    <text x="455" y="92">MONGODB</text>
    <text x="630" y="92">REDIS</text>
    <text x="750" y="92">SOCKET.IO</text>
  </g>

  <text x="120" y="236" fill="#F8FAFC" font-family="Poppins, Segoe UI, system-ui, sans-serif" font-weight="700" font-size="104" letter-spacing="0.5">PulseCheck</text>
  <text x="122" y="296" fill="#C7D2FE" font-family="Segoe UI, Inter, system-ui, sans-serif" font-weight="400" font-size="34">Realtime Uptime Monitoring SaaS</text>
  <text x="122" y="338" fill="#A5F3FC" font-family="Segoe UI, Inter, system-ui, sans-serif" font-weight="500" font-size="27">Live Telemetry • Background Checks • Subscription-Ready Architecture</text>

  <g opacity="0.9" fill="#93C5FD">
    <circle cx="1328" cy="124" r="5"/>
    <circle cx="1360" cy="124" r="5"/>
    <circle cx="1392" cy="124" r="5"/>
  </g>

  <rect x="14" y="14" width="1572" height="492" rx="18" stroke="#E2E8F0" stroke-opacity="0.16" stroke-width="1.2"/>
</svg>
